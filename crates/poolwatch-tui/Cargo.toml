[package]
name = "poolwatch-tui"
description = "poolwatch — htop for your mempool (terminal UI binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "poolwatch"
path = "src/main.rs"

[dependencies]
poolwatch-core = { path = "../poolwatch-core" }
poolwatch-adapters = { path = "../poolwatch-adapters" }
ratatui = "0.30"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shellexpand = "3"
