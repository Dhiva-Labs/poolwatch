# Package metadata for the other-distribution packages (.rpm, Arch package,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. The installed tree is built in
# release.yml from the static musl release archive, so every format ships
# the same binary as the tarball.

NAME=poolwatch
APP_NAME=poolwatch
GITHUB_REPO=Dhiva-Labs/poolwatch
TAG_PREFIX=v                 # release tags are v0.2.0
SUMMARY='htop for your mempool: watch your own blockchain daemons in the terminal'
DESCRIPTION='A single static binary that watches the mempools of your own blockchain daemons (Monero, Oxen, Beldex, Bitcoin and compatible forks) side by side in the terminal, over their native RPC. No external APIs, no database, no web frontend, nothing phones home.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/poolwatch
LICENSE=MIT
LICENSE_FILE=LICENSE

# A static musl binary: no shared libraries, and poolwatch runs no other
# programs, so neither format has runtime dependencies.
RPM_REQUIRES=()
ARCH_DEPENDS=()
ARCH_INDEPENDENT=0

# A terminal program: no AppImage (the release archive already is one
# self-contained binary).
APPIMAGE=0

# Smoke test run in each distribution container by verify.sh: the repo's own
# end-to-end check (--version, then --once against a mock monerod and against
# a closed port). verify.sh mounts the checkout at /repo.
GUI_CMD=''
SMOKE_CMD='python3 /repo/.github/scripts/smoke.py /usr/bin/poolwatch'
# Extra packages each container installs for SMOKE_CMD.
SMOKE_PKGS_DNF=(python3)
SMOKE_PKGS_SUSE=(python3)
SMOKE_PKGS_ARCH=(python)
