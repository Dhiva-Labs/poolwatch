name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  musl-build:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: verify static
        run: |
          file target/x86_64-unknown-linux-musl/release/poolwatch
          ldd target/x86_64-unknown-linux-musl/release/poolwatch 2>&1 | grep -q "not a dynamic executable" || { echo "binary is not static"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: poolwatch-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/poolwatch
