name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build static binary + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-release
      - name: build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: package
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/poolwatch
          # ldd wording differs by binary flavor: "not a dynamic executable"
          # (static) vs "statically linked" (static-pie).
          ldd "$BIN" 2>&1 | grep -qE "statically linked|not a dynamic executable" || { echo "binary is not static"; exit 1; }
          NAME=poolwatch-${GITHUB_REF_NAME}-x86_64-linux-musl
          mkdir "$NAME"
          cp "$BIN" LICENSE README.md poolwatch.example.toml "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "poolwatch $GITHUB_REF_NAME" \
            --generate-notes \
            poolwatch-*.tar.gz poolwatch-*.tar.gz.sha256
