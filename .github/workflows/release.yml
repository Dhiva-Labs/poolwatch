name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: the archives and packages are built, verified and uploaded as
  # workflow artifacts, but nothing is published (the release job is
  # tag-only).
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: build ${{ matrix.arch }} static binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            file_arch: x86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            file_arch: ARM aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-release-${{ matrix.arch }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          BIN=target/${{ matrix.target }}/release/poolwatch
          .github/scripts/verify-linux-binary.sh "$BIN" "${{ matrix.file_arch }}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION=$GITHUB_REF_NAME; else VERSION="test-${GITHUB_SHA::7}"; fi
          NAME=poolwatch-${VERSION}-${{ matrix.arch }}-linux-musl
          mkdir dist "$NAME"
          cp "$BIN" LICENSE README.md poolwatch.example.toml "$NAME/"
          tar czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          cat "dist/$NAME.tar.gz.sha256"
          # Prove the archive that ships is the working binary, not just the build output.
          mkdir unpacked
          tar xzf "dist/$NAME.tar.gz" -C unpacked
          .github/scripts/verify-linux-binary.sh "unpacked/$NAME/poolwatch" "${{ matrix.file_arch }}"
          python3 .github/scripts/smoke.py "unpacked/$NAME/poolwatch"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: build ${{ matrix.arch }} Windows executable
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            host: x86_64-pc-windows-msvc
            pe_machine: '0x8664'
          - arch: aarch64
            runner: windows-11-arm
            host: aarch64-pc-windows-msvc
            pe_machine: '0xAA64'
    steps:
      - uses: actions/checkout@v4
      - name: Install rustup (native)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/${{ matrix.host }}/rustup-init.exe" -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --default-host ${{ matrix.host }} --default-toolchain none --profile minimal
            Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup --version
          rustup set default-host ${{ matrix.host }}
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup show
          rustc -vV
          if ((rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value -ne '${{ matrix.host }}') {
            throw 'rustc host is not ${{ matrix.host }}'
          }
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release-${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build
        run: cargo build --release
      - name: package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .github/scripts/assert-pe-machine.ps1 -Path target\release\poolwatch.exe -Machine ${{ matrix.pe_machine }}
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME } else { $version = "test-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "poolwatch-$version-${{ matrix.arch }}-windows-msvc"
          New-Item -ItemType Directory dist, $name | Out-Null
          Copy-Item target\release\poolwatch.exe, LICENSE, README.md, poolwatch.example.toml $name
          Compress-Archive -Path $name -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\dist\$name.zip.sha256", "$hash  $name.zip`n")
          Get-Content "dist\$name.zip.sha256"
          # Prove the archive that ships is the working binary, not just the build output.
          Expand-Archive "dist\$name.zip" -DestinationPath unpacked
          .github/scripts/assert-pe-machine.ps1 -Path "unpacked\$name\poolwatch.exe" -Machine ${{ matrix.pe_machine }}
          python .github/scripts/smoke.py "unpacked\$name\poolwatch.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Repackages each architecture's static binary for Fedora/RHEL/openSUSE
  # (.rpm) and Arch (.pkg.tar.zst), straight from the archive that ships, then
  # installs both on the real distribution and runs the smoke test there. A
  # terminal program gets no AppImage or Flatpak: the archive already is one
  # self-contained binary.
  distros:
    name: rpm + Arch package ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb_arch: amd64, nfpm_arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, deb_arch: arm64, nfpm_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: archive
      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build .rpm and Arch package
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $VERSION"
            exit 1
          fi
          # The installed tree, built from the release archive itself.
          tar -xzf archive/*.tar.gz -C "$RUNNER_TEMP"
          src="$(echo "$RUNNER_TEMP"/poolwatch-*-linux-musl)"
          root="$RUNNER_TEMP/root"
          install -Dm755 "$src/poolwatch" "$root/usr/bin/poolwatch"
          install -Dm644 "$src/README.md" "$src/poolwatch.example.toml" -t "$root/usr/share/doc/poolwatch/"
          VERSION="$VERSION" packaging/linux-distros/pack.sh "$root" ${{ matrix.deb_arch }} dist
          cd dist
          for f in *.rpm *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-distros-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # AUR recipe: PKGBUILD + .SRCINFO for poolwatch-bin, rendered with this
  # build's checksums and proven with makepkg on archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          merge-multiple: true
          path: archives
      - name: Render and check the PKGBUILD
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          VERSION="$VERSION" packaging/arch/aur.sh \
            archives/*-x86_64-linux-musl.tar.gz archives/*-aarch64-linux-musl.tar.gz dist
          cd dist
          for f in *-aur.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-aur
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [linux, windows, distros, aur]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "poolwatch $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
